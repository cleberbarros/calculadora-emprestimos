<div class="container">
  <h1>Calculadora de Empréstimos</h1>

  <form [formGroup]="formulario" (ngSubmit)="calcular()">
    <div class="form-group">
      <label for="dataInicial">Data inicial</label>
      <input id="dataInicial" type="date" formControlName="dataInicial" />
    </div>

    <div class="form-group">
      <label for="dataFinal">Data final</label>
      <input id="dataFinal" type="date" formControlName="dataFinal" />
    </div>

    <div class="form-group">
      <label for="primeiroPagamento">Primeiro pagamento</label>
      <input id="primeiroPagamento" type="date" formControlName="primeiroPagamento" />
    </div>

    <div class="form-group">
      <label for="valorEmprestimo">Valor do empréstimo</label>
      <input id="valorEmprestimo" type="number" formControlName="valorEmprestimo" step="0.01" min="0.01" />
    </div>

    <div class="form-group">
      <label for="taxaJuros">Taxa de juros (%)</label>
      <input id="taxaJuros" type="number" formControlName="taxaJuros" step="0.01" min="0.01" />
    </div>

    <button type="submit" [disabled]="formulario.invalid || carregando">
      {{ carregando ? 'CALCULANDO...' : 'CALCULAR' }}
    </button>
  </form>

  @if (resultado) {
    <div class="resultado">
      <p>Quantidade de parcelas: <strong>{{ resultado.quantidadeParcelas }}</strong></p>
    </div>
  }

  @if (erro) {
    <div class="erro">
      <p>{{ erro }}</p>
    </div>
  }
</div>
